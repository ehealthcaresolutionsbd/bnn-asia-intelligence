# api.bnnasia.org – public read-only API (cached)
server {
    listen 443 ssl http2;
    server_name api.bnnasia.org;
    ssl_certificate     /etc/letsencrypt/live/api.bnnasia.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.bnnasia.org/privkey.pem;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options nosniff always;
    location /admin/ { return 404; }                      # admin only on research.bnnasia.org
    location /static/ { alias /static/; expires 30d; }
    location / {
        limit_except GET HEAD OPTIONS { deny all; }
        proxy_pass http://web:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        gzip on; gzip_types application/json;
    }
}
# research.bnnasia.org – researcher / super-admin interface. Restrict by IP or VPN if possible.
server {
    listen 443 ssl http2;
    server_name research.bnnasia.org;
    ssl_certificate     /etc/letsencrypt/live/research.bnnasia.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/research.bnnasia.org/privkey.pem;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    client_max_body_size 25m;
    # allow 203.0.113.0/24; deny all;   # <- uncomment with BNN office/VPN ranges
    location = / { return 302 /admin/; }
    location /static/ { alias /static/; expires 30d; }
    location / { proxy_pass http://web:8000; proxy_set_header Host $host; proxy_set_header X-Forwarded-Proto https; }
}
server { listen 80; server_name api.bnnasia.org research.bnnasia.org; return 301 https://$host$request_uri; }
