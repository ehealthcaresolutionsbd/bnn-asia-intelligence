name: Build & publish image
on:
  push:
    branches: [ main ]
    paths: [ "backend/**", ".github/workflows/docker.yml" ]
  workflow_dispatch:
permissions:
  contents: read
  packages: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: backend
          push: true
          tags: |
            ghcr.io/ehealthcaresolutionsbd/bnn-asia-intelligence:latest
            ghcr.io/ehealthcaresolutionsbd/bnn-asia-intelligence:${{ github.sha }}
          labels: org.opencontainers.image.source=https://github.com/ehealthcaresolutionsbd/bnn-asia-intelligence
