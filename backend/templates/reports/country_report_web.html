<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{ report.title }} · BNN Asia</title>
<meta name="description" content="BNN Asia data-driven annual country report: {{ report.country.name }}, {{ report.reporting_period.name }}.">
<style>
:root { --red: #C8102E; --ink: #0E1116; --grey: #6B7280; --line: #E5E7EB; }
* { box-sizing: border-box; }
body { margin: 0; font: 16px/1.6 "Manrope", "DejaVu Sans", system-ui, sans-serif; color: var(--ink); background: #fff; }
.cover { position: relative; padding: 56px max(20px, calc((100vw - 900px) / 2)) 32px; border-top: 10px solid var(--red); background: #FAFAFB; }
.brand { font-weight: 800; font-size: 26px; letter-spacing: 2px; } .brand-asia { color: var(--red); margin-left: 6px; }
.cover-kicker { color: var(--grey); font-size: 12px; letter-spacing: 1.5px; text-transform: uppercase; }
.cover-type { margin-top: 36px; color: var(--red); font-weight: 700; letter-spacing: 2px; text-transform: uppercase; font-size: 13px; }
.cover-country { font-size: clamp(34px, 7vw, 56px); line-height: 1.05; margin: 8px 0; }
.cover-period { font-size: 18px; }
.cover-meta { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 12px; margin: 28px 0 0; border-top: 2px solid var(--ink); padding-top: 14px; }
.cover-meta dt { font-size: 11px; text-transform: uppercase; letter-spacing: 1px; color: var(--grey); } .cover-meta dd { margin: 0; font-weight: 600; }
.cover-note { font-size: 13px; color: var(--grey); border-left: 3px solid var(--red); padding-left: 10px; margin-top: 24px; max-width: 640px; }
.draft-banner { display: inline-block; background: var(--red); color: #fff; font-weight: 800; padding: 6px 12px; margin-top: 16px; }
.superseded-banner { display: inline-block; border: 1px solid var(--grey); color: var(--grey); padding: 6px 12px; margin-top: 16px; }
.toc-web { max-width: 900px; margin: 24px auto 0; padding: 0 20px; } .toc-title { font-weight: 700; font-size: 12px; letter-spacing: 1px; text-transform: uppercase; color: var(--grey); }
.toc-web ol { columns: 2; column-gap: 32px; padding-left: 20px; } .toc-web a { color: var(--ink); }
.downloads a { display: inline-block; background: var(--ink); color: #fff; padding: 8px 14px; text-decoration: none; font-weight: 600; font-size: 14px; }
.report { max-width: 900px; margin: 0 auto; padding: 16px 20px 40px; }
h2 { font-size: 24px; border-bottom: 2px solid var(--ink); padding-bottom: 6px; margin: 40px 0 14px; }
h2::before { content: ""; display: inline-block; width: 12px; height: 12px; background: var(--red); margin-right: 10px; }
.findings-box { background: #FBF1F2; border-left: 4px solid var(--red); padding: 14px 18px; } .findings-box li { margin-bottom: 8px; }
table.data { width: 100%; border-collapse: collapse; font-size: 14px; margin: 12px 0; display: block; overflow-x: auto; }
table.data th { text-align: left; font-size: 11px; text-transform: uppercase; color: var(--grey); border-bottom: 2px solid var(--ink); padding: 6px 8px; white-space: nowrap; }
table.data td { border-bottom: 1px solid var(--line); padding: 6px 8px; vertical-align: top; }
.num { text-align: right; white-space: nowrap; } .unit { color: var(--grey); font-size: 12px; } .tag { color: var(--red); font-size: 11px; text-transform: uppercase; }
sup { color: var(--red); }
.chart { margin: 18px 0; } .chart img { max-width: 100%; height: auto; display: block; } .chart figcaption { font-size: 13px; color: var(--grey); }
.cites { font-size: 13px; color: #4B5563; border-top: 1px solid var(--line); padding-top: 8px; overflow-wrap: anywhere; } .cites a { color: var(--ink); } .rec { color: #9CA3AF; }
.report-footer { max-width: 900px; margin: 0 auto 40px; padding: 12px 20px; font-size: 12px; color: var(--grey); border-top: 1px solid var(--line); }
@media (max-width: 600px) { .toc-web ol { columns: 1; } body { font-size: 15px; } }
</style></head><body>
{% include "reports/_report_body.html" %}
</body></html>
